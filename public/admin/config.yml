backend:
  name: github
  repo: DariuS231/eton-manor-site
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/news"
    public_folder: "{{public_folder}}/news"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown", body: true }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Time", name: "time", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - label: "Event Type"
        name: "eventType"
        widget: "select"
        options: ["Club Run", "Race", "Social"]
      - label: "External Link"
        name: "externalLink"
        widget: "string"
        required: false
        pattern: ["^https?://", "Must start with http:// or https://"]
      - { label: "Description", name: "body", widget: "markdown", body: true }

  - name: "team"
    label: "Team"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    media_folder: "{{media_folder}}/team"
    public_folder: "{{public_folder}}/team"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - label: "Photo Focal Point"
        name: "photoFocalPoint"
        widget: "select"
        required: false
        hint: "If the photo's crop is cutting off their face, adjust this."
        options:
          - { label: "Top", value: "top" }
          - { label: "Center", value: "center" }
          - { label: "Bottom", value: "bottom" }
      - label: "Order"
        name: "order"
        widget: "number"
        required: false
        hint: "Lower numbers appear first on the Team page. Leave blank to sort after ordered members, alphabetically."
      - { label: "Bio", name: "body", widget: "markdown", body: true, required: false }

  - name: "content-pages"
    label: "Content Pages"
    folder: "src/content/content-pages"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/content-pages"
    public_folder: "{{public_folder}}/content-pages"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown", body: true }

  - name: "sponsors"
    label: "Sponsors"
    folder: "src/content/sponsors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    media_folder: "{{media_folder}}/sponsors"
    public_folder: "{{public_folder}}/sponsors"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Link"
        name: "url"
        widget: "string"
        pattern: ["^https?://", "Must start with http:// or https://"]
      - { label: "Logo", name: "logo", widget: "image" }

  - name: "documents"
    label: "Documents"
    folder: "src/content/documents"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/documents"
    public_folder: "{{public_folder}}/documents"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "File", name: "file", widget: "file" }

  - name: "meeting-minutes"
    label: "Meeting Minutes"
    folder: "src/content/meeting-minutes"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/meeting-minutes"
    public_folder: "{{public_folder}}/meeting-minutes"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "File", name: "file", widget: "file" }

  - name: "fixtures"
    label: "Race Fixtures"
    folder: "src/content/fixtures"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Distance"
        name: "distance"
        widget: "select"
        options: ["5K", "5 Miles", "10K", "10 Miles", "Half Marathon", "Marathon", "Ultra"]

  - name: "results"
    label: "Results"
    folder: "src/content/results"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/results"
    public_folder: "{{public_folder}}/results"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Result Documents"
        name: "links"
        widget: "list"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "File", name: "file", widget: "file" }

  - name: "kit"
    label: "Club Kit"
    folder: "src/content/kit"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    media_folder: "{{media_folder}}/kit"
    public_folder: "{{public_folder}}/kit"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Price (GBP)", name: "priceGBP", widget: "number", value_type: "float" }
      - label: "Sizes"
        name: "sizes"
        widget: "list"
        required: false
        field: { label: "Size", name: "size", widget: "string" }

  - name: "configuration"
    label: "Configuration"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/data/home.json"
        media_folder: "{{media_folder}}/site"
        public_folder: "{{public_folder}}/site"
        fields:
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - { label: "Hero Subheading", name: "heroSubheading", widget: "text" }
          - { label: "Hero Button Label", name: "heroCtaLabel", widget: "string" }
          - { label: "Hero Button Link", name: "heroCtaUrl", widget: "string" }
          - { label: "Intro Text", name: "introBody", widget: "text" }
          - label: "Hero Background Images"
            name: "heroImages"
            widget: "list"
            required: false
            field: { label: "Image", name: "image", widget: "image" }
      - name: "team"
        label: "Team Page"
        file: "src/data/team.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro Text", name: "introText", widget: "markdown", required: false }
      - name: "privacy-policy"
        label: "Privacy Policy"
        file: "src/data/privacy-policy.json"
        media_folder: "{{media_folder}}/site"
        public_folder: "{{public_folder}}/site"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Content", name: "content", widget: "markdown", required: false }
      - name: "right-to-be-forgotten"
        label: "Right to be Forgotten"
        file: "src/data/right-to-be-forgotten.json"
        media_folder: "{{media_folder}}/site"
        public_folder: "{{public_folder}}/site"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Content", name: "content", widget: "markdown", required: false }
      - name: "race-fixtures"
        label: "Race Fixtures Page"
        file: "src/data/race-fixtures.json"
        media_folder: "{{media_folder}}/site"
        public_folder: "{{public_folder}}/site"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Content", name: "content", widget: "markdown", required: false }
      - name: "results"
        label: "Results Page"
        file: "src/data/results.json"
        media_folder: "{{media_folder}}/site"
        public_folder: "{{public_folder}}/site"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Content", name: "content", widget: "markdown", required: false }
      - name: "settings"
        label: "Site Settings"
        file: "src/data/settings.json"
        media_folder: "{{media_folder}}/site"
        public_folder: "{{public_folder}}/site"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - label: "Navigation Links"
            name: "navLinks"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - label: "Submenu Items"
                name: "children"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - label: "Sub-Submenu Items"
                    name: "children"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "URL", name: "url", widget: "string" }
          - { label: "Footer Text", name: "footerText", widget: "string" }
          - label: "Social Links"
            name: "socials"
            widget: "list"
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options: ["Instagram", "Facebook", "Strava", "X"]
              - { label: "URL", name: "url", widget: "string" }
